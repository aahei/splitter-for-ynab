name: Splitter for YNAB

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover and plan without writes'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ynab-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Discover, reconcile, and report
        env:
          YNAB_TOKEN_A: ${{ secrets.YNAB_TOKEN_A }}
          YNAB_TOKEN_B: ${{ secrets.YNAB_TOKEN_B }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          python main.py "${args[@]}"
